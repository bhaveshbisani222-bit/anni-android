name: Build ANNI Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Accept Android SDK Licenses
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses || true
          fi

      - name: Download Sherpa-ONNX AAR (v2.0.3)
        run: |
          mkdir -p app/libs
          curl -fSL -o app/libs/sherpa-onnx-2.0.3.aar \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/v2.0.3/sherpa-onnx-2.0.3.aar
          ls -lh app/libs/sherpa-onnx-2.0.3.aar

      - name: Download KWS & Speaker Verification Models
        run: |
          mkdir -p app/src/main/assets

          # 1. English Keyword Spotting (Wake-Word) Model
          KWS_DIR="sherpa-onnx-kws-zipformer-gigaspeech-3.3M-2024-01-01"
          curl -fSL -o "${KWS_DIR}.tar.bz2" \
            "https://github.com/k2-fsa/sherpa-onnx/releases/download/kws-models/${KWS_DIR}.tar.bz2"
          tar jxf "${KWS_DIR}.tar.bz2"
          rm -f "${KWS_DIR}.tar.bz2"

          # Generate custom wake-word tokens for ANNI using sentencepiece directly
          python3 -m pip install sentencepiece
          python3 - << 'PYEOF'
          import sentencepiece as spm

          kws_dir = "sherpa-onnx-kws-zipformer-gigaspeech-3.3M-2024-01-01"
          with open(f"{kws_dir}/tokens.txt", "r", encoding="utf-8") as f:
              valid_tokens = {line.strip().split()[0] for line in f if line.strip()}

          sp = spm.SentencePieceProcessor()
          sp.load(f"{kws_dir}/bpe.model")

          phrases = [
              ("HEY ANNI", ":1.5", "#0.25", "@HEY_ANNI"),
              ("HEY ANNIE", ":1.5", "#0.25", "@HEY_ANNIE"),
              ("OK ANNI", ":1.5", "#0.25", "@OK_ANNI"),
              ("OK ANNIE", ":1.5", "#0.25", "@OK_ANNIE"),
              ("HELLO ANNI", ":1.5", "#0.25", "@HELLO_ANNI"),
              ("ANNI", ":1.2", "#0.35", "@ANNI"),
              ("ANNIE", ":1.2", "#0.35", "@ANNIE"),
          ]

          lines = []
          for text, score, thresh, tag in phrases:
              pieces = sp.encode(text, out_type=str)
              if not all(p in valid_tokens for p in pieces):
                  pieces = sp.encode(text.lower(), out_type=str)
              if all(p in valid_tokens for p in pieces):
                  lines.append(" ".join(pieces + [score, thresh, tag]))
              else:
                  print(f"Skipping {text}, missing tokens: {[p for p in pieces if p not in valid_tokens]}")

          assert lines, "No wake-word keywords could be tokenized!"
          with open(f"{kws_dir}/keywords.txt", "w", encoding="utf-8") as out:
              out.write("\n".join(lines) + "\n")
          print("Generated keywords.txt:\n" + "\n".join(lines))
          PYEOF

          rm -f "${KWS_DIR}/bpe.model" "${KWS_DIR}/keywords_raw.txt" "${KWS_DIR}/README.md"
          rm -f "${KWS_DIR}"/*.int8.onnx
          rm -rf "${KWS_DIR}/test_wavs"
          mv "${KWS_DIR}" "app/src/main/assets/${KWS_DIR}"

          # 2. English Speaker Verification (Voiceprint) Model (CAM++)
          curl -fSL -o "app/src/main/assets/3dspeaker_speech_campplus_sv_en_voxceleb_16k.onnx" \
            "https://github.com/k2-fsa/sherpa-onnx/releases/download/speaker-recongition-models/3dspeaker_speech_campplus_sv_en_voxceleb_16k.onnx"

          ls -lh app/src/main/assets/
          ls -lh "app/src/main/assets/${KWS_DIR}/"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload ANNI APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ANNI-AI-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Publish Direct APK Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk ANNI-AI.apk
          gh release delete v1.0.0 -y || true
          gh release create v1.0.0 ANNI-AI.apk \
            --title "A.N.N.I. AI Android v1.0.0" \
            --notes "Direct APK download for Android phone (Hey Anni + Voiceprint + Lock Screen Siri Assistant)"
